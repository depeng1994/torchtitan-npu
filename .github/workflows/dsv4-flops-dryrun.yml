name: DSV4 FLOPs dry run

on:
  push:
    branches:
      - fix/dsv4-flops-estimator
  workflow_dispatch:

jobs:
  meta-flops:
    runs-on: ubuntu-latest
    env:
      TORCH_DEVICE_BACKEND_AUTOLOAD: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --extra-index-url https://download.pytorch.org/whl/nightly/cpu \
            torch==2.14.0.dev20260719
          python -m pip install \
            "torchtitan @ git+https://github.com/pytorch/torchtitan.git@2807d3f550fe27db18bd9395ba63176364eaed6d" \
            pybind11==3.0.4 numpy PyYAML ninja scipy==1.13.1 safetensors==0.8.0 pytest triton
          python -m pip install -e . --no-deps

      - name: Run DSV4 config and meta FLOPs tests
        run: |
          python - <<'PY'
          import importlib
          import pathlib
          import sys
          import types

          import pytest

          root = pathlib.Path.cwd()
          namespace_packages = {
              "torchtitan_npu": root / "torchtitan_npu",
              "torchtitan_npu.patches": root / "torchtitan_npu" / "patches",
              "torchtitan_npu.patches.torchtitan": root / "torchtitan_npu" / "patches" / "torchtitan",
              "torchtitan_npu.patches.torchtitan.models": root / "torchtitan_npu" / "patches" / "torchtitan" / "models",
              "torchtitan_npu.patches.torchtitan.models.common": root / "torchtitan_npu" / "patches" / "torchtitan" / "models" / "common",
          }
          for name, path in namespace_packages.items():
              module = types.ModuleType(name)
              module.__package__ = name
              module.__path__ = [str(path)]
              sys.modules[name] = module

          # Load only the pure-Python TorchTitan compatibility patches required
          # to construct the DSV4 config/model.  Avoid the package-level NPU
          # runtime initialization that requires CANN/HCCL on a CPU runner.
          importlib.import_module(
              "torchtitan_npu.patches.torchtitan.models.common.moe"
          )
          importlib.import_module(
              "torchtitan_npu.patches.torchtitan.models.common.token_dispatcher"
          )

          raise SystemExit(
              pytest.main(
                  [
                      "-q",
                      "tests/unit_tests/models/deepseek_v4/test_dsv4_config.py",
                  ]
              )
          )
          PY
