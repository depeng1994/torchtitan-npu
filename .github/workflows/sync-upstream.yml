name: Sync Upstream

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print commands without pushing)"
        type: boolean
        default: false
  schedule:
    - cron: "0 14 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Preserve GitHub workflow
        run: cp .github/workflows/sync-upstream.yml /tmp/sync-upstream.yml

      - name: Add upstream remote
        run: |
          git remote add upstream https://gitcode.com/cann/torchtitan-npu.git
          git fetch upstream --tags
          git fetch upstream '+refs/heads/*:refs/remotes/upstream/*'

      - name: List upstream branches
        run: |
          echo "=== Upstream branches ==="
          git branch -r --list 'upstream/*' --format='%(refname:lstrip=3)' | grep -v HEAD

      - name: Sync all branches
        run: |
          default_branch="${{ github.event.repository.default_branch }}"
          dry_run="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run }}"

          for branch in $(git branch -r --list 'upstream/*' --format='%(refname:lstrip=3)' | grep -v HEAD); do
            echo "Syncing $branch..."

            if [[ "$dry_run" == "true" ]]; then
              if [[ "$branch" == "$default_branch" ]]; then
                echo "  [DRY RUN] sync upstream/$branch to origin/$branch and preserve .github/workflows/sync-upstream.yml"
              else
                echo "  [DRY RUN] git push origin refs/remotes/upstream/$branch:refs/heads/$branch --force-with-lease"
              fi
              continue
            fi

            if [[ "$branch" == "$default_branch" ]]; then
              git switch --detach "refs/remotes/upstream/$branch"
              mkdir -p .github/workflows
              cp /tmp/sync-upstream.yml .github/workflows/sync-upstream.yml
              git add .github/workflows/sync-upstream.yml

              if git diff --cached --quiet "refs/remotes/origin/$branch" -- .; then
                echo "  $branch is already synchronized."
                continue
              fi

              git commit -m "[ci] preserve GitHub upstream sync workflow"
              git push origin "HEAD:refs/heads/$branch" --force-with-lease
            else
              git push origin "refs/remotes/upstream/$branch:refs/heads/$branch" --force-with-lease
            fi
          done

      - name: Push tags
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true') }}
        run: git push origin --tags
