name: Lite Actions Common
on:
  workflow_call:
    inputs:
      workflow:
        required: true
        type: string
      default_cases:
        required: true
        type: string
      test_cases:
        type: string
        default: ""
      default_worker:
        required: true
        type: string
      default_target_pool:
        required: true
        type: string
      default_docker:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    if: >-
      github.repository == 'cann-framework/torchtitan-npu' &&
      ((github.event_name == 'pull_request' && github.base_ref == 'master') ||
       (github.event_name == 'workflow_dispatch' &&
        (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/ci/'))))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      plan_digest: ${{ steps.plan.outputs.plan_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Expand immutable test plan
        id: plan
        env:
          CI_TEST_CASES: ${{ inputs.test_cases != '' && inputs.test_cases || inputs.default_cases }}
          CI_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          CI_WORKFLOW: ${{ inputs.workflow }}
          CI_DEFAULT_WORKER: ${{ inputs.default_worker }}
          CI_DEFAULT_TARGET_POOL: ${{ inputs.default_target_pool }}
          CI_DEFAULT_DOCKER: ${{ inputs.default_docker }}
        run: PYTHONPATH="$PWD" python3 .github/scripts/lite_actions/prepare_request.py
      - uses: actions/upload-artifact@v4
        with:
          name: lite-ci-request-${{ github.run_attempt }}
          path: .ci-request/ci-request.json
          retention-days: 1
          if-no-files-found: error
  case:
    # Pull-request CI validates and expands the immutable plan, but never
    # dispatches NPU work. Hardware cases require an explicit workflow_dispatch.
    if: github.event_name != 'pull_request'
    needs: prepare
    name: ${{ matrix.test_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Wait for assigned worker
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          CI_RESULT_AUTHOR: ${{ vars.LITE_CI_RESULT_ACTOR }}
          CI_PLAN_DIGEST: ${{ needs.prepare.outputs.plan_digest }}
          CI_CASE: ${{ toJSON(matrix) }}
          CI_WORKFLOW: ${{ inputs.workflow }}
        run: python3 .github/scripts/lite_actions/wait_result.py
