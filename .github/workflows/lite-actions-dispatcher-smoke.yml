name: Dispatcher-Smoke

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a3-2p-ci
  cancel-in-progress: false
  queue: max

jobs:
  ci:
    if: github.repository == 'torchtitan-npu/torchtitan-npu' && ((github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'master') || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/ci/'))))
    runs-on: ubuntu-latest
    # Phase 1 serial queue can place smoke behind long training runs.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Wait for dispatcher-only npu-smi probe
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          CI_RESULT_AUTHOR: ${{ vars.LITE_CI_RESULT_ACTOR }}
          CI_WAIT_TIMEOUT_SECONDS: "4800"
        run: python3 .github/scripts/lite_actions/wait_result.py --case a3-smoke
