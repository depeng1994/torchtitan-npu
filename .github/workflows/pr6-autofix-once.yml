name: PR6 one-shot formatting autofix

on:
  push:
    branches:
      - rfc/deepseek-v4-1-training

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install formatters
        run: python -m pip install pre-commit ruff==0.14.14
      - name: Apply deterministic fixes
        run: |
          pre-commit run end-of-file-fixer --all-files || true
          ruff check --fix --line-length 120 --exclude '.agents/**,tests/**' . || true
          ruff format --line-length 120 --exclude '.agents/**,tests/**' .
      - name: Collect modified files
        run: |
          mkdir -p /tmp/autofix
          git diff --name-only -z | while IFS= read -r -d '' path; do
            mkdir -p "/tmp/autofix/$(dirname "$path")"
            cp "$path" "/tmp/autofix/$path"
          done
          git diff --stat
      - name: Upload autofix files
        uses: actions/upload-artifact@v4
        with:
          name: pr6-autofix-files
          path: /tmp/autofix
          if-no-files-found: error
