name: PR6 final validation

on:
  push:
    branches:
      - rfc/deepseek-v4-1-training
  pull_request:
    branches:
      - master

jobs:
  unit-and-precommit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TORCH_DEVICE_BACKEND_AUTOLOAD: '0'
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show validated revision
        run: |
          git rev-parse HEAD
          git log -1 --oneline
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "PR head: ${{ github.event.pull_request.head.sha }}"
            echo "merge parent 1: $(git rev-parse HEAD^1)"
            echo "merge parent 2: $(git rev-parse HEAD^2)"
            echo "origin/master: $(git rev-parse origin/master)"
            test "$(git rev-parse HEAD^1)" = "$(git rev-parse origin/master)"
            test "$(git rev-parse HEAD^2)" = "${{ github.event.pull_request.head.sha }}"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pre-commit pyrefly pytest
          python -m pip install -e .
          python -m pyrefly --version

      - name: Prepare TorchTitan source for Pyrefly
        run: |
          rm -rf /tmp/torchtitan
          git clone --depth 1 --branch v0.3.0 https://github.com/pytorch/torchtitan.git /tmp/torchtitan
          test "$(git -C /tmp/torchtitan rev-parse HEAD)" = "086bf6c166ec85c1298eb5596fa9bf95f6a2d840"

      - name: Prepare CPU-only import bootstrap
        run: |
          rm -rf /tmp/pr6-ci-bootstrap
          mkdir -p /tmp/pr6-ci-bootstrap
          cat > /tmp/pr6-ci-bootstrap/sitecustomize.py <<'PY'
          import os
          import pathlib
          import sys
          import types

          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])

          def namespace(name: str, path: pathlib.Path) -> None:
              if name in sys.modules:
                  return
              module = types.ModuleType(name)
              module.__file__ = str(path / "__init__.py")
              module.__path__ = [str(path)]
              module.__package__ = name
              sys.modules[name] = module

          namespace("torchtitan_npu", root / "torchtitan_npu")
          namespace("torchtitan_npu.models", root / "torchtitan_npu" / "models")
          namespace("torchtitan_npu.patches", root / "torchtitan_npu" / "patches")
          namespace(
              "torchtitan_npu.models.deepseek_v41",
              root / "torchtitan_npu" / "models" / "deepseek_v41",
          )
          PY

      - name: V4 unit tests
        id: v4
        continue-on-error: true
        env:
          PYTHONPATH: /tmp/pr6-ci-bootstrap
        run: pytest -q tests/unit_tests/models/deepseek_v4/

      - name: V41 unit tests
        id: v41
        if: always()
        continue-on-error: true
        env:
          PYTHONPATH: /tmp/pr6-ci-bootstrap
        run: pytest -q tests/unit_tests/models/deepseek_v41/

      - name: Pyrefly master baseline diagnostic
        if: always()
        continue-on-error: true
        run: |
          rm -rf /tmp/pr6-master
          git worktree add --detach /tmp/pr6-master origin/master
          (
            cd /tmp/pr6-master
            python -m pyrefly check --config pyproject.toml > /tmp/pr6-master-pyrefly.log 2>&1 || true
          )
          echo "master error summary:"
          grep -E '^ INFO [0-9]+ errors|^ERROR ' /tmp/pr6-master-pyrefly.log | tail -n 60 || true

      - name: Pre-commit
        id: precommit
        if: always()
        continue-on-error: true
        run: pre-commit run --all-files

      - name: Enforce validation result
        if: always()
        run: |
          echo "V4 UT: ${{ steps.v4.outcome }}"
          echo "V41 UT: ${{ steps.v41.outcome }}"
          echo "pre-commit: ${{ steps.precommit.outcome }}"
          test "${{ steps.v4.outcome }}" = success
          test "${{ steps.v41.outcome }}" = success
          test "${{ steps.precommit.outcome }}" = success
