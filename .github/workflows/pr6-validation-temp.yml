name: PR6 temporary final validation

on:
  push:
    branches:
      - rfc/deepseek-v4-1-training

jobs:
  unit-and-precommit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pre-commit pyrefly pytest
          python -m pip install -e .

      - name: V4 unit tests
        run: pytest -q tests/unit_tests/models/deepseek_v4/

      - name: V41 unit tests
        run: pytest -q tests/unit_tests/models/deepseek_v41/

      - name: Pre-commit
        run: pre-commit run --all-files
