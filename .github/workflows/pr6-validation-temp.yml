name: PR6 temporary final validation

on:
  push:
    branches:
      - rfc/deepseek-v4-1-training

jobs:
  unit-and-precommit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TORCH_DEVICE_BACKEND_AUTOLOAD: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pre-commit pyrefly pytest
          python -m pip install -e .

      - name: Prepare TorchTitan source for Pyrefly
        run: |
          rm -rf /tmp/torchtitan
          git clone --depth 1 --branch v0.3.0 https://github.com/pytorch/torchtitan.git /tmp/torchtitan
          test "$(git -C /tmp/torchtitan rev-parse HEAD)" = "086bf6c166ec85c1298eb5596fa9bf95f6a2d840"

      - name: V4 unit tests
        id: v4
        continue-on-error: true
        run: |
          python - <<'PY'
          import pathlib
          import sys
          import types
          import pytest

          root = pathlib.Path.cwd()
          package = types.ModuleType("torchtitan_npu")
          package.__file__ = str(root / "torchtitan_npu" / "__init__.py")
          package.__path__ = [str(root / "torchtitan_npu")]
          package.__package__ = "torchtitan_npu"
          sys.modules["torchtitan_npu"] = package
          raise SystemExit(pytest.main(["-q", "tests/unit_tests/models/deepseek_v4/"]))
          PY

      - name: V41 unit tests
        id: v41
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          import pathlib
          import sys
          import types
          import pytest

          root = pathlib.Path.cwd()
          package = types.ModuleType("torchtitan_npu")
          package.__file__ = str(root / "torchtitan_npu" / "__init__.py")
          package.__path__ = [str(root / "torchtitan_npu")]
          package.__package__ = "torchtitan_npu"
          sys.modules["torchtitan_npu"] = package
          raise SystemExit(pytest.main(["-q", "tests/unit_tests/models/deepseek_v41/"]))
          PY

      - name: Pre-commit
        id: precommit
        if: always()
        continue-on-error: true
        run: pre-commit run --all-files

      - name: Enforce validation result
        if: always()
        run: |
          echo "V4 UT: ${{ steps.v4.outcome }}"
          echo "V41 UT: ${{ steps.v41.outcome }}"
          echo "pre-commit: ${{ steps.precommit.outcome }}"
          test "${{ steps.v4.outcome }}" = success
          test "${{ steps.v41.outcome }}" = success
          test "${{ steps.precommit.outcome }}" = success
