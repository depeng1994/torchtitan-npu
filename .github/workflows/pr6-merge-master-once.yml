name: PR6 one-shot merge master materializer

on:
  push:
    branches:
      - rfc/deepseek-v4-1-training

jobs:
  materialize-merge:
    if: github.event.head_commit.message == 'ci: materialize master merge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge latest master without committing
        run: |
          git fetch origin master
          git merge --no-commit --no-ff origin/master
          git status --short
      - name: Collect merged files
        run: |
          mkdir -p /tmp/merged
          git diff --cached --name-only -z | while IFS= read -r -d '' path; do
            mkdir -p "/tmp/merged/$(dirname "$path")"
            cp "$path" "/tmp/merged/$path"
          done
          git diff --cached --stat
      - name: Upload merged files
        uses: actions/upload-artifact@v4
        with:
          name: pr6-master-merge-files
          path: /tmp/merged
          if-no-files-found: error
